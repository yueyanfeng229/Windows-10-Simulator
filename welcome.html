<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Screen</title>
<style>
@font-face {
    font-family: SysFont;
    src: url('sys.ttf');
}
*{margin:0;padding:0;box-sizing:border-box}
body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background: url('logscreen.jpg') no-repeat center center;
    background-size: cover;
    position:relative;
}
.user-avatar{
    position:absolute;
    top:32%;
    left:50%;
    transform:translateX(-50%);
    max-width:28vw;
}
.username-text{
    position:absolute;
    top:56%;
    left:50%;
    transform:translateX(-50%);
    color:#ffffff;
    font-size:56px;
    font-family: SysFont, sans-serif;
}
.bottom-group{
    position:absolute;
    top:68%;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:16px;
}
.boot-res{
    max-width:10vw;
}
.welcome-text{
    color:#ffffff;
    font-size:36px;
    font-family: SysFont, sans-serif;
}
</style>
</head>
<body>
<img class="user-avatar" src="userlogo.png">
<div class="username-text">User</div>
<div class="bottom-group">
    <img class="boot-res" src="boot_resource.gif">
    <div class="welcome-text">welcome</div>
</div>

<script>
setTimeout(()=>{
    window.location.href="desktop.html";
},5000);
</script>
</body>
</html>
